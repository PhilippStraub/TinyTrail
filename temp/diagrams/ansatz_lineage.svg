<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Vom klassischen Regressions-Head zu Option 1</title>
<desc>Klassische Box-Regression lernt vier Freiheitsgrade per trainiertem Head. Der Grid-Zellen/FOMO-Ansatz verzichtet ganz darauf und liefert nur ein Zentrum ohne Boxgröße. Option 1 schließt genau diese Lücke, indem die Boxgröße per KNN-Nachbarschaft statt per trainiertem Head bestimmt wird.</desc>
<style>
text{font-family:Arial,sans-serif;}
.th{font-size:14px;font-weight:600;fill:#2c2c2a;}
.ts{font-size:12px;fill:#5f5e5a;}
.box{fill:#f1efe8;stroke:#888780;}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none;}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5;}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="box"><rect x="190" y="40" width="300" height="64" rx="8" stroke-width="0.5"/></g>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Klassische Box-Regression</text>
<text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central">4 Freiheitsgrade, trainierter Head</text>
<line x1="340" y1="104" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="190" y="140" width="300" height="64" rx="8" stroke-width="0.5"/></g>
<text class="th" x="340" y="162" text-anchor="middle" dominant-baseline="central" fill="#633806">Grid-Zellen (FOMO)</text>
<text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central" fill="#633806">nur Zentrum, keine Boxgröße</text>
<line x1="340" y1="204" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="240" width="300" height="64" rx="8" stroke-width="0.5"/></g>
<text class="th" x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="#085041">Option 1</text>
<text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central" fill="#085041">Boxgröße per KNN-Nachbarschaft</text>
</svg>
