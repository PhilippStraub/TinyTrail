<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mechanismus von Option 1</title>
<desc>Eine feuernde Grid-Zelle liefert das Zentrum. Die k nächsten Nachbarn im Feature-Raum liefern parallel die Klasse per Voting und die Boxgröße per IDW-gewichtetem Mittelwert der gespeicherten Nachbar-Boxgrößen. Beide Ergebnisse werden zur fertigen Box zusammengeführt.</desc>
<style>
text{font-family:Arial,sans-serif;}
.th{font-size:14px;font-weight:600;fill:#2c2c2a;}
.ts{font-size:12px;fill:#5f5e5a;}
.box{fill:#f1efe8;stroke:#888780;}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none;}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5;}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="box"><rect x="210" y="40" width="260" height="56" rx="8" stroke-width="0.5"/></g>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Grid-Zelle feuert</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Zentrum (x,y) bereits fix</text>
<line x1="340" y1="96" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="210" y="140" width="260" height="56" rx="8" stroke-width="0.5"/></g>
<text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">k nächste Nachbarn</text>
<text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">Feature-Distanz im Grid</text>
<path d="M340 196 L340 218 L170 218 L170 240" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M340 196 L340 218 L510 218 L510 240" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="240" width="220" height="56" rx="8" stroke-width="0.5"/></g>
<text class="th" x="170" y="258" text-anchor="middle" dominant-baseline="central" fill="#085041">Klasse</text>
<text class="ts" x="170" y="278" text-anchor="middle" dominant-baseline="central" fill="#085041">Voting / Nearest-Centroid</text>
<g class="c-coral"><rect x="400" y="240" width="220" height="56" rx="8" stroke-width="0.5"/></g>
<text class="th" x="510" y="258" text-anchor="middle" dominant-baseline="central" fill="#712B13">Boxgröße</text>
<text class="ts" x="510" y="278" text-anchor="middle" dominant-baseline="central" fill="#712B13">IDW-Mittel der Nachbarn</text>
<path d="M170 296 L170 318 L340 318 L340 340" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M510 296 L510 318 L340 318 L340 340" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="210" y="340" width="260" height="56" rx="8" stroke-width="0.5"/></g>
<text class="th" x="340" y="358" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Fertige Box</text>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central" fill="#3C3489">x, y, w, h, Klasse</text>
</svg>
